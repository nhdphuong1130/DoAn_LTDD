[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "english7-api"
version = "0.1.0"
description = "API-first backend for the English 7 grounded learning app"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
  "fastembed>=0.8,<0.9",
  "PyJWT>=2.10,<3",
  "minio>=7.2,<8",
  "neo4j>=5.28,<6",
  "pyodbc>=5.2,<6",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
  "fastembed>=0.4,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.13,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]
vision = [
  "doclayout-yolo>=0.0.3,<0.1",
  "paddleocr>=3.3,<4",
  "paddlepaddle>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/english7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = ["integration: requires configured infrastructure services"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
