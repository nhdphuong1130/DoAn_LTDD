name: english7-knowledge-integration

services:
  sqlserver-integration:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: IntegrationOnly_12345
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [knowledge-integration]

  neo4j-integration:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/IntegrationOnly_12345
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p IntegrationOnly_12345
          "RETURN 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [knowledge-integration]

  knowledge-tests:
    build:
      context: ./backend
      target: runtime
    depends_on:
      sqlserver-integration:
        condition: service_healthy
      neo4j-integration:
        condition: service_healthy
    environment:
      ENGLISH7_DATABASE_URL: >-
        mssql+pyodbc://sa:IntegrationOnly_12345@sqlserver-integration:1433/english7_knowledge_integration?driver=FreeTDS&TDS_Version=8.0
      NEO4J_TEST_URI: bolt://neo4j-integration:7687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASSWORD: IntegrationOnly_12345
    command:
      - /bin/sh
      - -ec
      - |
        python -c "import pyodbc; c=pyodbc.connect('DRIVER={FreeTDS};SERVER=sqlserver-integration;PORT=1433;UID=sa;PWD=IntegrationOnly_12345;DATABASE=master;TDS_Version=8.0', autocommit=True); c.execute(\"IF DB_ID(N'english7_knowledge_integration') IS NULL CREATE DATABASE [english7_knowledge_integration]\"); c.close()"
        pytest -q tests/integration/test_knowledge_build.py
    networks: [knowledge-integration]

networks:
  knowledge-integration:
    driver: bridge
